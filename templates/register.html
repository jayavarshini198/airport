{% extends "base.html" %}

{% block title %}
Register | Smart Airport
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card register-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Register as a passenger
        </p>


        <form method="POST">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>


            <div class="form-group">
                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="120"
                    value="18"
                    required
                >
            </div>


            <div class="form-group">

                <label>
                    Do you require airport assistance?
                </label>

                <select
                    name="assistance_required"
                    id="assistance_required"
                >
                    <option value="no">
                        No
                    </option>

                    <option value="yes">
                        Yes
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="assistance_type">
                    Assistance Type
                </label>

                <select
                    name="assistance_type"
                    id="assistance_type"
                >

                    <option value="">
                        Select if required
                    </option>

                    <option value="Wheelchair Assistance">
                        Wheelchair Assistance
                    </option>

                    <option value="Elderly Assistance">
                        Elderly Assistance
                    </option>

                    <option value="Pregnancy Assistance">
                        Pregnancy Assistance
                    </option>

                    <option value="Visual Assistance">
                        Visual Assistance
                    </option>

                    <option value="Hearing Assistance">
                        Hearing Assistance
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Is mobility assistance required?
                </label>

                <select
                    name="mobility_required"
                    id="mobility_required"
                >

                    <option value="no">
                        No
                    </option>

                    <option value="yes">
                        Yes
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="connection_minutes">
                    Connecting Flight Time (minutes)
                </label>

                <input
                    type="number"
                    id="connection_minutes"
                    name="connection_minutes"
                    min="0"
                    value="120"
                >

                <small>
                    Enter 0 if you do not have a connecting flight.
                </small>

            </div>


            <button
                type="submit"
                class="btn btn-full"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login here
            </a>

        </p>

    </div>

</div>

{% endblock %}
